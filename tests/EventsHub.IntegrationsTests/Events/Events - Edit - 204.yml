info:
  name: Events - Edit - 204
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "0031d30b-7d3d-4474-8341-365c0df67964",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "drinks",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "20.2114",
        "longitude": "-87.4287"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 Not Found", function(){
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns right data", function() {
          const body = res.getBody();
          expect(body).to.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
